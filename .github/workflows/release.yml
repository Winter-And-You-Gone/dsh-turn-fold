name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
      - run: npm publish
      # 包名更名后，已安装旧包的用户其更新仍走旧包名，因此同一份源码
      # 还要以 dsh-turn-fold 再发布一次（脚本就地替换 package.json /
      # cordis.patch.yml 的包名，紧接着 npm publish；旧包名与主包名都需
      # 在 npmjs.com 配置好指向本工作流的 Trusted Publishing）。
      - name: Publish legacy package name
        run: |
          node scripts/publish-legacy.mjs
          npm publish

  github-release:
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists; nothing to do."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"

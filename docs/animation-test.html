<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh-turn-fold 动画独立测试</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; }
  button { padding: 8px 16px; font-size: 14px; cursor: pointer; margin-bottom: 12px; }
  #clip { overflow: hidden; }
  #body { min-width: 0; min-height: 0; }
  .card { border: 1px solid #d0d7de; border-radius: 8px; padding: 10px 14px; margin: 6px 0; background: #f6f8fa; }
  .card b { display: block; margin-bottom: 4px; }
  .note { color: #57606a; font-size: 13px; margin: 12px 0; }
  #log { color: #57606a; font-size: 12px; font-family: monospace; margin-top: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
  <h2>dsh-turn-fold 展开动画测试页</h2>
  <p class="note">此页独立于 DSH，复现 client.js 里 FoldClip 的动画逻辑（Web Animations API）。
  点「展开」应看到内容在约 280ms 内从 0 高度展开 + 淡入 + 上移归位；点「收起」立即消失。</p>
  <button id="toggle">展开</button>
  <div id="wrap"></div>
  <div id="log"></div>

<script>
  'use strict';
  // ---- 与 client.js FoldClip 相同的动画逻辑 ----
  var open = false;
  var animRef = null;

  function log(msg) {
    var el = document.getElementById('log');
    el.textContent += msg + '\n';
  }

  function render() {
    var wrap = document.getElementById('wrap');
    if (!open) {
      // 收起：播放收缩动画（高度→0 + 淡出 + 下移），完成后卸载
      var clip = document.getElementById('clip');
      var reduced = false;
      try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
      if (clip && typeof clip.animate === 'function' && !reduced) {
        var cur = parseInt(clip.style.height, 10);
        if (isNaN(cur) || cur <= 0) cur = Math.max(0, clip.firstElementChild ? clip.firstElementChild.offsetHeight : clip.scrollHeight);
        if (cur > 0) {
          if (animRef) { try { animRef.cancel(); } catch (e) {} animRef = null; }
          var anim = clip.animate(
            [
              { height: cur + 'px', opacity: 1, transform: 'translateY(0)' },
              { height: '0px', opacity: 0, transform: 'translateY(-4px)' }
            ],
            { duration: 200, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'forwards' }
          );
          animRef = anim;
          log('收起动画已启动：height ' + cur + 'px -> 0, 200ms');
          anim.onfinish = function () {
            animRef = null;
            try { anim.commitStyles(); } catch (e) {}
            try { anim.cancel(); } catch (e) {}
            wrap.innerHTML = '';
            log('收起完成，内容卸载');
          };
          document.getElementById('toggle').textContent = '展开';
          return;
        }
      }
      wrap.innerHTML = '';
      log('收起：内容立即卸载（fallback）');
      document.getElementById('toggle').textContent = '展开';
      return;
    }
    // 展开：以折叠态挂载（注意 #clip 的 overflow:hidden —— 与 DSH 里 .ccg-fold-clip 一致，
    // 用于复现 scrollHeight 可能为 0 的环境）
    wrap.innerHTML =
      '<div id="clip" style="height:0px;opacity:0;overflow:hidden"><div id="body" style="min-width:0;min-height:0">' +
      '<div class="card"><b>工具调用 #1 (pwsh)</b>命令输出占位内容，用于撑出真实高度。</div>' +
      '<div class="card"><b>工具调用 #2 (read)</b>第二张卡片，继续撑高。</div>' +
      '<div class="card"><b>工具调用 #3 (glob)</b>第三张卡片。动画应把这三张卡片从 0 高度平滑展开。</div>' +
      '</div></div>';
    var clip = document.getElementById('clip');

    requestAnimationFrame(function () {
      var body = clip.firstElementChild;
      var scrollH = Math.max(0, clip.scrollHeight);
      var bodyH = Math.max(0, body ? body.offsetHeight : 0);
      log('clip.scrollHeight = ' + scrollH + 'px | body.offsetHeight = ' + bodyH + 'px');
      var target = body ? bodyH : scrollH;
      if (target <= 0) { clip.style.height = 'auto'; clip.style.opacity = 1; log('fallback: auto'); return; }

      // prefers-reduced-motion 检查（与 client.js 一致）
      var reduced = false;
      try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
      log('prefers-reduced-motion = ' + reduced);
      if (reduced || typeof clip.animate !== 'function') {
        clip.style.height = target + 'px'; clip.style.opacity = 1;
        log('fallback: 直接显示（reduced-motion 或无 WAAPI）');
        return;
      }

      var anim = clip.animate(
        [
          { height: '0px', opacity: 0, transform: 'translateY(-4px)' },
          { height: target + 'px', opacity: 1, transform: 'translateY(0)' }
        ],
        { duration: 280, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'forwards' }
      );
      animRef = anim;
      log('WAAPI 动画已启动：height 0 -> ' + target + 'px, 280ms');
      anim.onfinish = function () {
        animRef = null;
        try { anim.commitStyles(); } catch (e) {}
        try { anim.cancel(); } catch (e) {}
        clip.style.height = target + 'px';
        log('动画完成，最终高度 ' + target + 'px');
      };
    });
    document.getElementById('toggle').textContent = '收起';
  }

  document.getElementById('toggle').addEventListener('click', function () {
    open = !open;
    log('--- 点击：open = ' + open + ' ---');
    render();
  });
  log('页面就绪。点「展开」看展开动画，再点「收起」看收起动画。');
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扑克牌折叠图标 · 两态动画演示</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    background: #0f1115;
    color: #e5e7eb;
    font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    margin: 0;
    padding: 28px 32px 48px;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 6px; letter-spacing: .2px; }
  .sub { color: #8b93a1; font-size: 13px; margin: 0 0 18px; line-height: 1.6; }
  .sub b { color: #b6bcc8; font-weight: 600; }

  .toolbar { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
  .btn {
    background: #23272f;
    color: #cdd3dc;
    border: 1px solid #343a45;
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .btn:hover { border-color: #4f6ef7; color: #fff; }

  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

  .card {
    background: #1a1d23;
    border: 1px solid #2a2e36;
    border-radius: 10px;
    padding: 16px 16px 14px;
    cursor: pointer;
    user-select: none;
    transition: border-color .15s ease, transform .15s ease;
  }
  .card:hover { border-color: #4f6ef7; transform: translateY(-1px); }

  .name { font-size: 13px; font-weight: 600; }
  .demo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    height: 84px;
    margin: 6px 0 2px;
  }
  .ic { display: inline-flex; align-items: center; justify-content: center; color: #9aa3b2; flex: none; }
  .ic svg { display: block; }

  .state-label {
    text-align: center;
    font-size: 12px;
    color: #4f6ef7;
    font-weight: 600;
    letter-spacing: .5px;
  }
  .desc { font-size: 12px; color: #8b93a1; margin-top: 8px; line-height: 1.55; }
  .tag {
    display: inline-block;
    font-size: 10px;
    color: #8b93a1;
    border: 1px solid #2a2e36;
    border-radius: 999px;
    padding: 1px 8px;
    margin-top: 8px;
  }
  .tag.rec { color: #4f6ef7; border-color: #3b4a80; }

  /* 动画：CSS transition 驱动 transform 属性变化（SVG 原生 rotate(角度, cx, cy) 指定旋转中心，
     不依赖 transform-origin / transform-box——它们在部分浏览器对 SVG <g> 不生效）。
     所有牌同步过渡：无交错延迟，同时开始、同时到达终态。 */
  .card-i {
    transition: transform .6s cubic-bezier(.22, 1, .36, 1);
  }
</style>
</head>
<body>

<h1>扑克牌 · 折叠/展开图标（两态动画演示）</h1>
<p class="sub">
  <b>收起 = 牌堆</b>，<b>展开 = 扇形</b>（绕<b>牌底边中点</b>旋转，最右的牌在最上层）。点击卡片或「切换全部」查看动画；
  展开时牌从底层开始扇形散开（交错延迟），收起时顶层先落回牌堆。每项展示 <b>16px</b>（实际尺寸）与 <b>40px</b>（放大预览），虚线为 viewBox 外框（正式实现不含）。
</p>

<div class="toolbar">
  <button class="btn" id="toggleAll">切换全部</button>
  <button class="btn" id="autoDemo">▶ 自动演示</button>
</div>

<div class="grid" id="grid"></div>

<div class="note" style="margin-top:28px;font-size:12px;color:#8b93a1;line-height:1.7;border-top:1px solid #23262d;padding-top:16px">
  <b>几何说明</b>：收起（牌堆）与展开（扇形）两态的包围盒中心都精确对齐到 (8,8)，
  切换状态时图标整体不跳动。正式实现时把填充色 <code>#1a1d23</code> 换成折叠栏背景的
  主题 token，并按状态切换 <code>transform</code> 即可。
</div>

<script>
  const SPADE = '<path d="M12 2 C9 6.5, 4.5 8, 4.5 11.5 C4.5 13.4, 5.8 14.4, 7.2 13.9 C7.2 15.3, 8.4 16.5, 9.8 16.5 L9.8 17.5 L14.2 17.5 L14.2 16.5 C15.6 16.5, 16.8 15.3, 16.8 13.9 C18.2 14.4, 19.5 13.4, 19.5 11.5 C19.5 8, 15 6.5, 12 2 Z" fill="currentColor"/>'
  const HEART = '<path d="M12 20.5 C6.8 15.9, 2.8 12.6, 2.8 8.9 C2.8 6.1, 5 4, 7.4 4 C9.3 4, 10.9 5.1, 12 6.9 C13.1 5.1, 14.7 4, 16.6 4 C19 4, 21.2 6.1, 21.2 8.9 C21.2 12.6, 17.2 15.9, 12 20.5 Z" fill="currentColor"/>'
  const DIAMOND = '<path d="M12 2 L21 12 L12 22 L3 12 Z" fill="currentColor"/>'
  const CLUB = '<circle cx="12" cy="6.5" r="4.5" fill="currentColor"/><circle cx="8" cy="14.5" r="4.5" fill="currentColor"/><circle cx="16" cy="14.5" r="4.5" fill="currentColor"/><path d="M11.2 12.8 L12.8 12.8 L14.2 20.5 L9.8 20.5 Z" fill="currentColor"/>'
  // 花色信息：path + 自身包围盒中心（24 单位空间）+ 宽度系数（与黑桃等宽显示）
  const PIP_INFO = {
    spade: { path: SPADE, cx: 12, cy: 9.75, factor: 1 },
    heart: { path: HEART, cx: 12, cy: 12.25, factor: 15 / 18.4 },
    diamond: { path: DIAMOND, cx: 12, cy: 12, factor: 15 / 18 },
    club: { path: CLUB, cx: 12, cy: 11.25, factor: 15 / 17 },
  }

  // 3 张牌：rect (3.75,3.5)-(12.25,12)，底边中点 = (8,12)
  // 5 张牌：rect (4,4)-(12,12)，底边中点 = (8,12)
  const RX3 = 3.75, RY3 = 3.5, RW3 = 8.5, RH3 = 8.5, CX3 = 8, CY3 = 12
  const RX5 = 4, RY5 = 4, RW5 = 8, RH5 = 8, CX5 = 8, CY5 = 12

  // 牌堆（收起）和扇形（展开）的变换，包围盒中心均已对齐到 (8,8)
  const STACK3 = { 1: `translate(1, 2.25)`, 2: `translate(0, 0.25)`, 3: `translate(-1, -1.75)` }
  const STACK5 = { 1: `translate(1.6, 1.6)`, 2: `translate(0.8, 0.8)`, 3: `translate(0, 0)`, 4: `translate(-0.8, -0.8)`, 5: `translate(-1.6, -1.6)` }
  // 展开态 = 扇形（绕底边中点）。注意：中心牌（card-3）的变换必须保持纯 translate，
  // 否则牌堆→扇形时 translate→translate+rotate(0) 的列表形态变化会让浏览器跳过过渡。
  const FAN3 = { 1: `translate(0, -0.18) rotate(-26 8 12)`, 2: `translate(0, -0.18) rotate(26 8 12)`, 3: `translate(0, -0.18)` }
  const FAN5 = { 1: `translate(0, -0.608) rotate(-32 8 12)`, 2: `translate(0, -0.608) rotate(-16 8 12)`, 3: `translate(0, -0.608)`, 4: `translate(0, -0.608) rotate(16 8 12)`, 5: `translate(0, -0.608) rotate(32 8 12)` }
  // 水平镜像的牌堆（第二行用）：顶层牌在右上角，下层牌向左下角偏移（dx 取反，中心不变）
  const STACK3M = { 1: `translate(-1, 2.25)`, 2: `translate(0, 0.25)`, 3: `translate(1, -1.75)` }
  const STACK5M = { 1: `translate(-1.6, 1.6)`, 2: `translate(-0.8, 0.8)`, 3: `translate(0, 0)`, 4: `translate(0.8, -0.8)`, 5: `translate(1.6, -1.6)` }

  // 叠放顺序：牌堆顶牌最后画，扇形最右的牌最后画（右手握牌）
  const ORDER_STACK3 = [1, 2, 3]
  const ORDER_FAN3 = [1, 3, 2]
  const ORDER_STACK5 = [1, 2, 3, 4, 5]
  const ORDER_FAN5 = [1, 2, 3, 4, 5]

  function cardG(i, x, y, w, h, five, suit) {
    // 花色画在"每态的最上层牌"上：3 张版 = 牌堆顶 card-3 + 扇形顶（最右）card-2；
    // 5 张版 = 牌堆顶/扇形最右 card-5 + 扇形中心 card-3
    const info = PIP_INFO[suit] || PIP_INFO.spade
    const hasPip = five ? (i === 5 || i === 3) : (i === 2 || i === 3)
    // 图标画在卡牌中心：translate(牌中心) scale(缩放) translate(-花色中心)，缩放按宽度系数与黑桃等宽
    const pipScale = (five ? 0.24 : 0.28) * info.factor
    const pipInner = hasPip
      ? `<g transform="translate(${x + w / 2}, ${y + h / 2}) scale(${pipScale}) translate(${-info.cx}, ${-info.cy})">${info.path}</g>`
      : ''
    return `<g class="card-i" data-i="${i}" transform="translate(0, 0)">` +
      // 牌身用字面量背景色填充（上层牌实体遮挡下层牌）；正式实现时改为 CSS class + 主题 token
      `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.5" fill="#1a1d23" stroke="currentColor" stroke-width="0.7"/>` +
      pipInner + `</g>`
  }

  function svg(s, five, suit) {
    const x = five ? RX5 : RX3, y = five ? RY5 : RY3, w = five ? RW5 : RW3, h = five ? RH5 : RH3
    const n = five ? 5 : 3
    let inner = ''
    for (let i = 1; i <= n; i++) inner += cardG(i, x, y, w, h, five, suit)
    // 外边框（demo 专用，方便判断图标相对显示区域的位置，正式实现中不包含）
    return `<svg viewBox="0 0 16 16" width="${s}" height="${s}">` +
      `<rect class="demo-border" x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#39404d" stroke-width="0.5" stroke-dasharray="2 1.5"/>` +
      inner + `</svg>`
  }

  // 四种花色 × 3 张/5 张 = 8 个变体
  const SUIT_LABEL = { spade: '♠', heart: '♥', diamond: '♦', club: '♣' }
  const SUIT_NAME = { spade: '黑桃', heart: '红心', diamond: '方块', club: '梅花' }
  const cards = []
  for (const five of [false, true]) {
    for (const suit of ['spade', 'heart', 'diamond', 'club']) {
      cards.push({
        name: `扑克牌 · ${five ? 5 : 3} 张 ${SUIT_LABEL[suit]}`,
        five,
        suit,
        rec: suit === 'spade' && !five,
        tag: `${five ? 5 : 3} 张 · ${SUIT_NAME[suit]}`,
        desc: `${five ? 5 : 3} 张${SUIT_NAME[suit]}版，花色在每态最上层牌上，居中绘制。`,
      })
    }
  }

  const grid = document.getElementById('grid');
  const renderCards = (mirror) => cards.map((c) => `
    <div class="card">
      <div class="name">${c.name}${mirror ? '（镜像）' : ''}</div>
      <div class="demo ${c.five ? 'five' : ''} ${mirror ? 'mirror' : ''}" data-state="collapsed">
        <span class="ic">${svg(16, c.five, c.suit)}</span>
        <span class="ic">${svg(40, c.five, c.suit)}</span>
      </div>
      <div class="state-label">收起 · 牌堆</div>
      <div class="desc">${c.desc}</div>
      <span class="tag ${c.rec ? 'rec' : ''}">${c.tag}</span>
    </div>
  `).join('');
  // 第二行：牌堆水平镜像（顶层右上、下层向左下偏移），扇形不变
  grid.innerHTML = renderCards(false) + renderCards(true);

  const demos = [...document.querySelectorAll('.demo')];
  const labels = [...document.querySelectorAll('.state-label')];

  function applyState(demo, state) {
    const five = demo.classList.contains('five');
    const mirror = demo.classList.contains('mirror');
    const stackTable = five ? (mirror ? STACK5M : STACK5) : (mirror ? STACK3M : STACK3);
    const table = state === 'expanded' ? (five ? FAN5 : FAN3) : stackTable;
    const order = state === 'expanded' ? (five ? ORDER_FAN5 : ORDER_FAN3) : (five ? ORDER_STACK5 : ORDER_STACK3);
    // 调整叠放顺序：SVG 后画的元素在上层，用 appendChild 移到末尾
    for (const svg of demo.querySelectorAll('svg')) {
      for (const i of order) {
        const g = svg.querySelector('.card-i[data-i="' + i + '"]');
        if (g) svg.appendChild(g);
      }
      // 强制同步布局：DOM 移动后先提交当前样式，随后 transform 变化才能触发 transition
      // （否则浏览器把重排与 transform 变更合并到同一帧，动画直接跳到终态）
      void svg.getBoundingClientRect();
    }
    // 所有牌同步过渡：无交错延迟，同时开始、同时到达终态
    for (const g of demo.querySelectorAll('.card-i')) {
      const i = Number(g.dataset.i);
      g.style.transitionDelay = '0ms';
      g.setAttribute('transform', table[i]);
    }
    demo.dataset.state = state;
    labels[demos.indexOf(demo)].textContent = state === 'expanded' ? '展开 · 扇形' : '收起 · 牌堆';
  }

  for (const demo of demos) {
    const card = demo.closest('.card');
    card.addEventListener('click', () => {
      applyState(demo, demo.dataset.state === 'expanded' ? 'collapsed' : 'expanded');
    });
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.click(); }
    });
  }

  // 初始状态正确落位到「收起 · 牌堆」（首次渲染无过渡，直接显示正确牌堆）
  for (const demo of demos) applyState(demo, 'collapsed');

  document.getElementById('toggleAll').addEventListener('click', () => {
    for (const demo of demos) applyState(demo, demo.dataset.state === 'expanded' ? 'collapsed' : 'expanded');
  });

  let autoTimer = null;
  document.getElementById('autoDemo').addEventListener('click', function () {
    if (autoTimer !== null) {
      clearInterval(autoTimer); autoTimer = null;
      this.textContent = '▶ 自动演示';
      return;
    }
    this.textContent = '⏸ 停止演示';
    autoTimer = setInterval(() => {
      for (const demo of demos) applyState(demo, demo.dataset.state === 'expanded' ? 'collapsed' : 'expanded');
    }, 1200);
  });
</script>
</body>
</html>
